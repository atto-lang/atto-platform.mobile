name: Rust compiler fixture admission (host-only)
on:
  pull_request:
    paths:
      - 'tools/compiler-fixtures/**'
      - 'tests/compiler/**'
      - 'tests/test_platform_scalar_harness.ores'
      - 'tests/test_platform_scalar_extended.ores'
      - 'tests/test_platform_portable_core_v1.ores'
      - 'tests/platform-portable-core-integrity.test.mjs'
      - '.github/workflows/rust-compiler-fixtures-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-host-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify seven-platform portable baseline (source-only, non-promoting)
        run: node --test tests/platform-portable-core-integrity.test.mjs
      - name: Run Rust host admission tests (NOT a guest compiler proof)
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo test --offline --manifest-path tools/compiler-fixtures/Cargo.toml --all-targets
